  <body>
    <div class="container-background">
      <img
        class="container-background-image"
        src="image/image-home-page/backgground-hompage.avif"
      />
    </div>
    <div class="main-container">
      <header class="header-brand">
        <div class="container-text-find-hotel">
          <p class="brand-name-text">
            find <span class="hightlight-h">H</span>otel
          </p>
        </div>
      </header>

      <div class="container-find-hotel">
        <div class="find-hotel-header">
          <h1 class="province-name">Vientaine</h1>
        </div>
        <div class="container-select-province">
          <div class="left-section">
            <h2 class="conutry-name">Laos</h2>
            <div class="container-selection-province">
              <div class="box-selection-province">
                <label for="input-province">
                  <h3 class="select-province-text">select province</h3>
                </label>
                <input
                  type="text"
                  id="input-province"
                  class="input-province"
                  placeholder="province"
                />
              </div>
              <div class="sub-navigate-user">
                <p>
                  Lorem ipsum dolor sit amet consectetur adipisicing elit.
                  Quidem dolore excepturi facere distinctio, corporis molestiae,
                  libero explicabo veritatis atque hic amet quod error ducimus
                  ullam, sint reprehenderit neque obcaecati nobis.
                </p>
              </div>
            </div>
          </div>
          <div class="right-section">
            <div class="silder-container">
              <img
                class="image-hotel"
                name="hid-box"
                src="image/hotel-image/double-tree-by-hilton-vientiane.jpg"
              />

              <!-- main box-->
              <img
                class="image-hotel"
                src="image/hotel-image/3-nagas-luang-prabang.jpg"
              />
              <img
                class="image-hotel"
                src="image/hotel-image/amarivientiane.jpg"
              />
              <img
                class="image-hotel"
                src="image/hotel-image/double-tree-by-hilton-vientiane.jpg"
              />
              <!-- main box-->

              <img
                class="image-hotel"
                name="hid-box"
                src="image/hotel-image/3-nagas-luang-prabang.jpg"
              />
              <img
                class="image-hotel"
                src="image/hotel-image/amarivientiane.jpg"
              />
            </div>
            <div class="box-controls">
              <button class="move-next js-move-next">
                <img src="image/icon/arrow-icon-down.png" />
              </button>
              <button class="move-back js-move-back">
                <img src="image/icon/arrow-icon-up.png" />
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="script/home-page.js"></script>
