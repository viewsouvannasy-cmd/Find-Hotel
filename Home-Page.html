<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Hotel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gantari:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gantari:ital,wght@0,100..900;1,100..900&family=Sassy+Frass&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/Home-Page.css" />
  </head>

  <body>
    <div class="container-background">
      <img
        class="container-background-image"
        src="image/image-home-page/backgground-hompage.avif"
      />
    </div>
    <div class="main-container">
      <header class="header-brand">
        <div class="container-text-find-hotel">
          <p class="brand-name-text">
            find <span class="hightlight-h">H</span>otel
          </p>
        </div>
      </header>

      <div class="container-find-hotel">
        <div class="find-hotel-header">
          <h1 class="province-name">Vientaine</h1>
          <h2 class="conutry-name">Laos</h2>
        </div>
        <div class="container-select-province">
          <div class="left-section">
            <div class="box-selection-province">
              <input
                type="text"
                id="input-province"
                class="input-province"
                placeholder="province"
                list="data-province"
              />
              <datalist id="data-province">
                <option value="Vientaine"></option>
                <option value="Luang Prabang"></option>
                <option value="Sainyabuli"></option>
                <option value="Xaisomboun"></option>
                <option value="Xiangkhouang"></option>
                <option value="Oudomxay"></option>
                <option value="Phongsaly"></option>
              </datalist>
              <p class="display-result-search"></p>
            </div>
          </div>
          <div class="right-section">
            <div class="silder-container"></div>
            <div class="box-controls">
              <button class="move-next js-move-next">
                <img src="image/icon/arrow-icon-down.png" />
              </button>
              <button class="move-back js-move-back">
                <img src="image/icon/arrow-icon-up.png" />
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="script/home-page.js"></script>
  </body>
</html>
